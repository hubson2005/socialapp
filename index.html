<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover : nécessaire pour les marges de sécurité iPhone (encoche, barre d'accueil) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Connexions anticipées vers Supabase :
       la 1re pour les appels API (fetch/CORS), la 2e pour les images (mode no-cors) -->
  <link rel="preconnect" href="https://gxguirtpunmiiuxpxlap.supabase.co" crossorigin />
  <link rel="preconnect" href="https://gxguirtpunmiiuxpxlap.supabase.co" />

  <!-- Polices de la page d'accueil (Sora + Inter), chargées dès le HTML -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&family=Inter:wght@500;600;700;800&display=swap" />

  <!-- Police : téléchargée dès le HTML (avant, elle n'était découverte qu'après le CSS).
       Nécessite le fichier /public/fonts/geist-latin-v3.woff2 (voir instructions). -->
  <link rel="preload" href="/fonts/geist-latin-v3.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="icon" type="image/png" href="/Logo_SocialApp.png" />
  <link rel="shortcut icon" href="/Logo_SocialApp.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <title>SocialApp – Profil digital, QR Code et CRM tout-en-un</title>

  <meta
    name="description"
    content="SocialApp permet de créer un profil digital, partager un QR Code, collecter des prospects et gérer vos clients avec un CRM intégré."
  />

  <!-- Couleur de la barre du navigateur : blanc cassé (identique à la page d'accueil) -->
  <meta name="theme-color" content="#f8f5ef" />
  <meta name="color-scheme" content="light" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- "default" : icônes sombres de la barre d'état, lisibles sur fond clair -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SocialApp" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SocialApp" />
  <meta property="og:title" content="SocialApp – Profil digital, QR Code et CRM tout-en-un" />
  <meta
    property="og:description"
    content="Créez votre profil digital, partagez votre QR Code et gérez vos prospects avec un CRM intégré."
  />
  <meta property="og:image" content="https://www.socialapp.work/Logo_SocialApp.png" />
  <meta property="og:url" content="https://www.socialapp.work/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SocialApp – Profil digital, QR Code et CRM tout-en-un" />
  <meta
    name="twitter:description"
    content="Créez votre profil digital, partagez votre QR Code et gérez vos prospects avec un CRM intégré."
  />
  <meta name="twitter:image" content="https://www.socialapp.work/Logo_SocialApp.png" />

  <!-- Fond clair immédiat (pas de flash) + style de la coquille -->
  <style>
    html, body { margin: 0; background: #f8f5ef; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    #shell {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box; color: #1d1a2b; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #shell h1 { margin: 0; font-size: 22px; font-weight: 600; }
    #shell p { margin: 0; max-width: 320px; opacity: .7; font-size: 14px; line-height: 1.4; }
  </style>

  <!-- Rempli côté serveur (api/profile.js) : preload de l'image principale + données du profil.
       Ne pas supprimer ce marqueur. -->
  <!--PROFILE_HEAD-->
</head>
<body>
  <div id="root"><!--SHELL_START--><div id="shell"><h1>SocialApp</h1></div><!--SHELL_END--></div>

  <noscript>
    <h1>SocialApp</h1>
    <p>Activez JavaScript pour utiliser SocialApp.</p>
  </noscript>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
