<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hors ligne · SocialApp</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; padding: 0;
    background: #0f0a1e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  .wrap {
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px;
    padding-top: max(32px, env(safe-area-inset-top, 0px));
    padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .icon {
    width: 64px; height: 64px; border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  h1 { color: #fff; font-size: 18px; font-weight: 800; margin: 0 0 8px; }
  p { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.6; margin: 0 0 24px; max-width: 320px; }
  button {
    background: rgba(99,102,241,0.92); color: #fff; border: none;
    border-radius: 999px; padding: 12px 28px; font-size: 14px; font-weight: 700;
    cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: translateY(1px); }
  .hint { margin-top: 28px; color: rgba(255,255,255,0.3); font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.8">
        <path d="M1 9a16 16 0 0 1 22 0M5 13a10 10 0 0 1 14 0M8.5 17a5 5 0 0 1 7 0" stroke-dasharray="2 3"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
        <circle cx="12" cy="20" r="1.2" fill="rgba(255,255,255,0.5)" stroke="none"/>
      </svg>
    </div>
    <h1>Ce profil n'est pas encore en cache</h1>
    <p>Vous êtes hors ligne et ce profil n'a pas encore été consulté sur cet appareil. Reconnectez-vous pour le voir une première fois.</p>
    <button onclick="window.location.reload()">Réessayer</button>
    <div class="hint">Les profils déjà visités restent disponibles hors ligne.</div>
  </div>
</body>
</html>
